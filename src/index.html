<meta charset="utf-8">
<title>A pan y verga</title>
<link rel="stylesheet" href="fonts/inline.css">
<style>
  :root { --ground: #060d18; --ink: #10131a; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  canvas { display: block; background: #081a2e; image-rendering: auto; outline: none; max-width: 100%; }
  canvas:focus-visible { box-shadow: 0 0 0 3px #2ec4b6; }
  body { box-sizing: border-box; }
  /* videos de cámara y voz: ocultos, el juego los dibuja en el marcador */
  #av { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; overflow: hidden; opacity: 0.01; pointer-events: none; }
  #av video { width: 2px; height: 2px; }
  /* aviso de pantalla completa en iPhone */
  #iosfs { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 10px 12px 10px 16px; border-radius: 16px; background: rgba(11,15,24,.94); border: 1px solid #2ec4b6; color: #f4f6fa; font: 600 14px/1.3 'Barlow', system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #iosfs b { color: #ffc53d; }
  #iosfs button { flex: 0 0 auto; border: 0; border-radius: 999px; width: 32px; height: 32px; background: #1f2a3a; color: #f4f6fa; font-size: 16px; }
</style>
<canvas id="game" tabindex="0" aria-label="A pan y verga: juego de peleas para hasta 4 jugadores. Usa un control o el teclado."></canvas>
